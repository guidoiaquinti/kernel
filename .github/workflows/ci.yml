# SPDX-License-Identifier: GPL-3.0-or-later
# Shared AArch64 userfs, all platform builds, host tests and QEMU profiles.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    # Required by main branch protection; keep this check name stable.
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Make AddressSanitizer usable
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Install filesystem fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools dosfstools
      - name: Host sanitizer suites
        run: tests/run-host-tests.sh
      - name: Scratch MBR image tests
        run: tests/run-mbr-image-tests.py
      - name: Build and launcher orchestration tests
        run: tests/run-build-tests.py
      - name: Feature status file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml
          tests/check-features.py

  userfs:
    name: Shared AArch64 userfs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install userfs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake mtools
      - name: Build user programs and FAT32 image once
        run: ./build.sh --userfs-only
      - name: Verify producer invalidation and atomic publication
        run: tests/run-userfs-tests.py
      - name: Upload shared userfs
        uses: actions/upload-artifact@v7
        with:
          name: userfs-aarch64
          path: |
            build/userfs/aarch64/koraos.img
            build/userfs/aarch64/user/*.elf
          if-no-files-found: error

  build-and-smoke:
    # Required by main branch protection; keep this check name stable.
    name: Build kernels + QEMU smoke test
    needs: userfs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: userfs-aarch64
          path: build/userfs/aarch64
      - name: Install kernel toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake mtools dosfstools qemu-system-arm
      - name: Build all four targets using shared userfs
        run: ./build.sh --target all --userfs-dir build/userfs/aarch64
      - name: Build and stage both hardware release targets
        run: ./build.sh --target hw_raspi3b --target hw_raspi4b --release --userfs-dir build/userfs/aarch64 --install-to sdcard-boot
      - name: Kernels never touch FP/SIMD registers
        run: tests/check-kernel-fp.py build/debug/*/kernel.elf build/release/*/kernel.elf
      - name: QEMU raspi3b smoke
        run: tests/run-qemu-smoke.py --target qemu_raspi3b --stress 3
      - name: Create boot image with both hardware targets
        run: ./create-sd-image.sh --target all --release --output build/koraos-boot.img
      - name: Verify both hardware boot files
        run: |
          test -s sdcard-boot/kernel8-rpi3.img
          test -s sdcard-boot/kernel8-rpi4.img
          test -s sdcard-boot/LICENCE.broadcom
          mdir -i build/koraos-boot.img ::/
      - name: Upload SD card boot files and image
        uses: actions/upload-artifact@v7
        with:
          name: sdcard-boot
          path: |
            sdcard-boot/
            build/koraos-boot.img
          if-no-files-found: error
      - name: Upload raspi3b smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-raspi3b
          path: build/debug/qemu_raspi3b/qemu-smoke/
          if-no-files-found: ignore

  virt-tests:
    name: QEMU virt (${{ matrix.profile }})
    needs: userfs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: embedded-graphics
            args: --repeat 64 --smp 4 --stress 3
          - profile: disk-keyboard
            args: --ram 128M --disk build/userfs/aarch64/koraos.img --keyboard --repeat 256
          - profile: mbr-disk
            args: --disk build/mbr-root.img --repeat 64
          - profile: multi-volume
            args: --disk build/multi-root.img --multi-volume --repeat 64
          - profile: writable-filesystem
            args: ""
          - profile: serial-small-ram
            args: --ram 64M --no-graphics --repeat 32
          - profile: el2-entry
            args: --el2 --no-graphics --repeat 32 --smp 4 --stress 3
          - profile: gicv3
            args: --gic 3 --smp 4 --repeat 64 --stress 3
          - profile: gicv3-el2
            args: --gic 3 --el2 --smp 4 --no-graphics --repeat 32 --stress 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: userfs-aarch64
          path: build/userfs/aarch64
      - name: Install kernel toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake mtools dosfstools qemu-system-arm
      - name: Build virt with prepared userfs
        run: ./build.sh --target qemu_virt --userfs-dir build/userfs/aarch64
      - name: Wrap shared root in a scratch MBR image
        if: matrix.profile == 'mbr-disk'
        run: tests/create-mbr-image.py --output build/mbr-root.img build/userfs/aarch64/koraos.img
      - name: Create two labeled scratch partitions
        if: matrix.profile == 'multi-volume'
        run: tests/create-multivolume-image.py --output build/multi-root.img build/userfs/aarch64/koraos.img
      - name: Exercise development profile
        if: matrix.profile != 'writable-filesystem'
        run: tests/run-qemu-smoke.py --target qemu_virt --out build/debug/qemu_virt/qemu-${{ matrix.profile }} ${{ matrix.args }}
      - name: Verify writable scratch filesystem from QEMU to host
        if: matrix.profile == 'writable-filesystem'
        run: tests/run-qemu-write.py --out build/debug/qemu_virt/qemu-${{ matrix.profile }}
      - name: Reject invalid configured root disk
        if: matrix.profile == 'disk-keyboard'
        run: |
          truncate -s 2M build/invalid.img
          tests/run-qemu-smoke.py --target qemu_virt --disk build/invalid.img --expect-root-failure --no-graphics --out build/debug/qemu_virt/qemu-invalid-disk
      - name: Upload virt serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virt-${{ matrix.profile }}
          path: build/debug/qemu_virt/qemu-*/
          if-no-files-found: ignore

  sd-tests:
    name: QEMU raspi3b SD card (${{ matrix.profile }})
    needs: userfs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sdsc-read-only
            size: 64
          - profile: sdhc-read-only
            size: 4096
          - profile: sdhc-writable
            size: 4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: userfs-aarch64
          path: build/userfs/aarch64
      - name: Install kernel toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake mtools dosfstools qemu-system-arm
      - name: Build raspi3b with prepared userfs
        if: matrix.profile != 'sdhc-writable'
        run: ./build.sh --target qemu_raspi3b --userfs-dir build/userfs/aarch64
      - name: Read a scratch card
        if: matrix.profile != 'sdhc-writable'
        run: |
          tests/create-sd-card-image.py build/userfs/aarch64/koraos.img --output build/sd-card.img --size-mib ${{ matrix.size }}
          tests/run-qemu-smoke.py --target qemu_raspi3b --sd build/sd-card.img --out build/debug/qemu_raspi3b/qemu-${{ matrix.profile }}
      - name: Build raspi3b with SD writes enabled
        if: matrix.profile == 'sdhc-writable'
        run: ./build.sh --target qemu_raspi3b --sd-writable --build-dir build/sd-writable --userfs-dir build/userfs/aarch64
      - name: Write a scratch card and verify it on the host
        if: matrix.profile == 'sdhc-writable'
        run: tests/run-qemu-sd-write.py --size-mib ${{ matrix.size }} --out build/debug/qemu_raspi3b/qemu-${{ matrix.profile }}
      - name: Upload SD serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sd-${{ matrix.profile }}
          path: |
            build/debug/qemu_raspi3b/qemu-*/*.log
            build/debug/qemu_raspi3b/qemu-*/*.png
          if-no-files-found: ignore

  raspi4b-tests:
    # QEMU's raspi4b machine arrived in QEMU 9.0; Ubuntu 24.04 ships 8.2, so
    # this job runs in Debian trixie (QEMU 10).
    name: QEMU raspi4b (${{ matrix.profile }})
    needs: userfs
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smoke-stress
          - profile: sdhc-read-only
          - profile: sdhc-writable
    steps:
      - name: Install kernel toolchain and QEMU
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 clang lld llvm cmake make mtools dosfstools qemu-system-arm
      - uses: actions/checkout@v7
      # The checkout belongs to the runner user but the container runs as
      # root, so git refuses the tree and the kernel loses its build id.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v7
        with:
          name: userfs-aarch64
          path: build/userfs/aarch64
      - name: Build raspi4b with prepared userfs
        if: matrix.profile != 'sdhc-writable'
        run: ./build.sh --target qemu_raspi4b --userfs-dir build/userfs/aarch64
      - name: Smoke test with repeated thread, kill and demo steps
        if: matrix.profile == 'smoke-stress'
        run: tests/run-qemu-smoke.py --target qemu_raspi4b --stress 3 --out build/debug/qemu_raspi4b/qemu-${{ matrix.profile }}
      - name: Read a scratch card on EMMC2
        if: matrix.profile == 'sdhc-read-only'
        run: |
          tests/create-sd-card-image.py build/userfs/aarch64/koraos.img --output build/sd-card.img --size-mib 4096
          tests/run-qemu-smoke.py --target qemu_raspi4b --sd build/sd-card.img --out build/debug/qemu_raspi4b/qemu-${{ matrix.profile }}
      - name: Build raspi4b with SD writes enabled
        if: matrix.profile == 'sdhc-writable'
        run: ./build.sh --target qemu_raspi4b --sd-writable --build-dir build/sd-writable --userfs-dir build/userfs/aarch64
      - name: Write a scratch card on EMMC2 and verify it on the host
        if: matrix.profile == 'sdhc-writable'
        run: tests/run-qemu-sd-write.py --target qemu_raspi4b --size-mib 4096 --out build/debug/qemu_raspi4b/qemu-${{ matrix.profile }}
      - name: Upload raspi4b serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raspi4b-${{ matrix.profile }}
          path: |
            build/debug/qemu_raspi4b/qemu-*/*.log
            build/debug/qemu_raspi4b/qemu-*/*.png
          if-no-files-found: ignore
